<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ t.brand }}{% endblock %}</title>
<style>
:root{
  --ink:#1c2530; --paper:#e7ebef; --panel:#fff; --rule:#aab4be;
  --signal:#8a5209; --ok:#1d6b45; --stop:#93292a; --muted:#5b6773;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:13px/1.5 Verdana,Tahoma,"DejaVu Sans",sans-serif}
a{color:#1a4f8a}
.titlebar{background:var(--ink);color:#e9eef3;padding:8px 16px;
  display:flex;justify-content:space-between;align-items:baseline}
.titlebar strong{letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.titlebar span{font-size:11px;color:#9fb0c0}
.statusstrip{background:#cfd7de;border-bottom:1px solid var(--rule);
  padding:4px 16px;font-size:11px;color:var(--muted)}
.wrap{max-width:980px;margin:18px auto;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--rule);margin-bottom:16px}
.panel > h2{margin:0;padding:7px 12px;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;background:#dde3e9;border-bottom:1px solid var(--rule)}
.panel .body{padding:12px}
.docket{font:12px/1.4 "DejaVu Sans Mono",Consolas,monospace;
  background:#f3f0e6;border:1px solid #c8bf9e;padding:1px 7px 1px 11px;
  position:relative;display:inline-block;letter-spacing:.04em}
.docket::before{content:"";position:absolute;left:3px;top:50%;width:4px;height:4px;
  margin-top:-2px;border-radius:50%;background:#c8bf9e}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;background:#eef1f4;border-bottom:1px solid var(--rule);
  padding:6px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
td{border-bottom:1px solid #dde3e9;padding:6px 8px;vertical-align:top}
.pill{font-size:10px;letter-spacing:.08em;padding:2px 6px;border:1px solid;text-transform:uppercase}
.s-PENDING{color:var(--signal);border-color:var(--signal);background:#fdf5e7}
.s-APPROVED{color:var(--ok);border-color:var(--ok);background:#eaf4ee}
.s-REJECTED{color:var(--stop);border-color:var(--stop);background:#f7ecec}
input[type=text],textarea,select{font:12px Verdana,Tahoma,sans-serif;
  border:1px solid #8d99a4;background:#fff;padding:5px 6px;width:100%}
textarea{min-height:70px;resize:vertical}
button,.btn{font:12px Verdana,Tahoma,sans-serif;background:#dfe5ea;
  border:1px solid #8d99a4;border-top-color:#fff;border-left-color:#fff;
  padding:5px 14px;cursor:pointer}
button:hover{background:#d2dae1}
button.primary{background:#25507e;color:#fff;border-color:#1a3a5c}
button.primary:hover{background:#1d4269}
:focus-visible{outline:2px solid #b8860b;outline-offset:1px}
[role=alert]{border:1px solid var(--stop);background:#f9eded;color:var(--stop);
  padding:8px 10px;margin-bottom:10px;font-size:12px}
.notice{border:1px solid var(--signal);background:#fdf5e7;padding:8px 10px;
  margin-bottom:10px;font-size:12px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
iframe{width:100%;border:0;display:block}
.modal-backdrop{position:fixed;inset:0;background:rgba(28,37,48,.55);z-index:50}
.modal{position:fixed;z-index:51;top:22%;left:50%;transform:translateX(-50%);
  width:440px;background:#fff;border:1px solid var(--rule);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.foot{font-size:11px;color:var(--muted);text-align:center;padding:8px 0 24px}
@media (max-width:620px){.dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="titlebar"><strong>{{ t.brand }}</strong><span>{{ t.subtitle }}</span></div>
<div class="statusstrip">Signed in as {{ user|default('operator.demo') }} &middot; Region: Midwest &middot; Build {{ t.build }}</div>
<div class="wrap">{% block content %}{% endblock %}</div>
<div class="foot">Fictional demo system. No real claims, members, or payments.</div>
</body>
</html>
