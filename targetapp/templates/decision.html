<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Decision panel</title>
<style>
body{margin:0;padding:12px;background:#fff;color:#1c2530;
  font:13px/1.5 Verdana,Tahoma,"DejaVu Sans",sans-serif}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:#5b6773;margin:8px 0 3px}
input,textarea,select{font:12px Verdana,Tahoma,sans-serif;border:1px solid #8d99a4;padding:5px 6px;width:100%;box-sizing:border-box}
textarea{min-height:64px}
button{font:12px Verdana,Tahoma,sans-serif;background:#25507e;color:#fff;
  border:1px solid #1a3a5c;padding:6px 16px;cursor:pointer;margin-top:10px}
[role=alert]{border:1px solid #93292a;background:#f9eded;color:#93292a;padding:7px 9px;font-size:12px}
.done{border:1px solid #1d6b45;background:#eaf4ee;color:#1d6b45;padding:7px 9px;font-size:12px}
:focus-visible{outline:2px solid #b8860b;outline-offset:1px}
</style></head><body>
{% if error %}<div role="alert" data-testid="decision-error">{{ error }}</div>{% endif %}
{% if c.status != 'PENDING' %}
  <div class="done">Decision already recorded: {{ c.status }}{% if c.confirmation %} (confirmation {{ c.confirmation }}){% endif %}.</div>
{% else %}
<form method="post" action="/claims/{{ c.claim_id }}/decision" target="_top">
  <label for="decision">Outcome</label>
  <select id="decision" name="decision" data-testid="{{ t.outcome_testid }}">
    <option value="">Select an outcome</option>
    <option value="APPROVED">Approve</option>
    <option value="REJECTED">Reject</option>
  </select>
  <label for="note">Decision note</label>
  <textarea id="note" name="note" placeholder="Explain the decision for the audit record"></textarea>
  <button type="submit" data-testid="{{ t.submit_testid }}">{{ t.submit_label }}</button>
</form>
{% endif %}
</body></html>
