[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sableau"
version = "1.0.0"
description = "Turn LLM-discovered UI workflows into deterministic, replayable capabilities"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "playwright>=1.60",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pip-tools>=7.4,<8",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
sableau = "sableau.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sableau.api" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs the live browser and target application"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "evidence", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/sableau/api",
  "src/sableau/kernel",
  "src/sableau/replay",
  "src/sableau/schema",
  "src/sableau/tenancy.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source_pkgs = [
  "sableau.api",
  "sableau.kernel",
  "sableau.replay",
  "sableau.schema",
  "sableau.tenancy",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
