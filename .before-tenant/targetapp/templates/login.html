{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="panel"><h2>Session ended</h2><div class="body">
<p data-testid="session-expired">Your session has ended. Sign in again to continue.</p>
<form method="post" action="/login">
  <label for="operator" style="font-size:11px;color:#5b6773">Operator id</label>
  <input type="text" id="operator" name="operator" value="operator.demo">
  <button type="submit" class="primary" style="margin-top:10px">Sign in</button>
</form>
</div></div>
{% endblock %}
